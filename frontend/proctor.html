<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Halls – Exam Seating Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>Exam Seating Planner</h1>
  <nav>
    <span id="who" class="who"></span>
    <button id="logout" class="secondary" type="button">Log out</button>
  </nav>
</header>
<main class="container">
  <section class="panel">
    <h2>Halls I supervise</h2>
    <table>
      <thead><tr><th>Exam</th><th>Date</th><th>Hall</th><th>Seat map</th></tr></thead>
      <tbody id="hall-rows"></tbody>
    </table>
    <p id="proctor-message" class="message" aria-live="polite"></p>
  </section>
</main>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/proctor.js" defer></script>
</body>
</html>
